# Navigation Links
#   To link a homepage widget, specify the URL as a hash `#` followed by the filename of the
  #     desired widget in your `content/home/` folder.
  #   The weight parameter defines the order that the links will appear in.

main:
  - name: Bio
    url: /
    weight: 10
  - name: Artículos
    url: /#papers
    weight: 11
  - name: Pláticas
    url: /#talks
    weight: 12
  - name: Noticias
    url: /#news
    weight: 13
  - name: Experiencia
    url: experience/
    weight: 20
  - name: Proyectos
    url: projects/
    weight: 30
  - name: Cursos
    url: courses/
    weight: 40
  - name: Divulgación # Nombre que se verá en la barra superior
    url: 'posts/' # Al poner 'post/' en vez de '#posts', abre una página completa
    weight: 40